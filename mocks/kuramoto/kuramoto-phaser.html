  const pool = [...S.hand], pay = [], miss = [];
  for (const m of ["麹", "酵母", ...RICES]) for (let i = 0; i < (needs[m] || 0); i++) { const j = pool.findIndex(c => c.m === m); if (j >= 0) pay.push(pool.splice(j, 1)[0]); else miss.push(m); }
  for (let i = 0; i < (needs.ANY || 0); i++) { const c = pool.filter(c => isRice(c.m)).sort((a, b) => (a.m === "山田錦") - (b.m === "山田錦"))[0]; if (c) { pay.push(c); pool.splice(pool.indexOf(c), 1); } else miss.push("米"); }

}

const Act = {
  hire(cid) { const i = S.field.findIndex(c => c.id === cid); const c = S.field[i]; const fee = ROLES[c.role].fee;
    if (S.money < fee) return "契約金が足りません。"; S.money -= fee; S.field.splice(i, 1); S.hired.push({ ...c, at: S.turn }); fillField(); return `${c.role}の${c.name}さんを雇いました。`; },
  refresh() { if (S.refreshed || S.money < 1) return "入れ替えは1ターン1回、1両です。"; S.money -= 1; S.refreshed = true; S.rdiscard.push(...S.field); S.field = []; fillField(); return ""; },
  buy(m) { if (S.buysLeft <= 0) return "取引先は1ターン2枚までです。"; const p = S.freeBuy ? 0 : priceOf(m); if (S.money < p) return "お金が足りません。";
    S.money -= p; S.freeBuy = false; S.buysLeft -= 1; S.hand.push({ id: nid(), m, bought: true }); return ""; },
  start(id) { const s = SAKE[id]; const plan = payPlan(s); if (plan.miss.length) return `${plan.miss.join("・")}が足りません。`;
    for (const c of plan.pay) { S.hand.splice(S.hand.indexOf(c), 1); if (!c.bought) S.discard.push(c.m); }
    if (plan.kojiSaved) S.kojiFree = false; S.brew.push({ id, filled: 0 }); return ""; },
  quit(id) { S.brew = S.brew.filter(b => b.id !== id); for (const pid of Object.keys(S.assign)) if (S.assign[pid] === id) delete S.assign[pid]; return "仕込みをやめました。"; },
  place(pid, sid) { pid = String(pid); if (!(pid in S.assign) && assignedCount() >= placeLimit()) return `このターン置けるのは${placeLimit()}人までです。`;
    S.assign[pid] = sid; const p = personOf(pid); return marksBy(p, sid) === 0 ? `${p.role}はこの酒ではマスを埋められません。` : ""; },
  unplace(pid) { delete S.assign[String(pid)]; return ""; },
  resolve(kind, arg) {
    const P = S.pending; if (!P) return "";
    if (P.type === "pick2") { S.hand.push({ id: nid(), m: arg, bought: true }); if (--P.left <= 0) S.pending = null; }
    else if (P.type === "breakdown") { if (kind === "pay") S.money -= 2; else { const b = S.brew.find(x => x.id === arg); if (b && b.filled > 0) b.filled -= 1; } S.pending = null; }
    else if (P.type === "interview") { S.pending = null; if (kind === "yes") { S.placeMinus += 1; const keys = Object.keys(S.assign); while (keys.length > placeLimit()) delete S.assign[keys.pop()]; return setBuff({ k: "add", v: 4, label: "次の出荷 +4両" }); } }
    else if (P.type === "newrice") { if (kind === "no") S.pending = null; else if (kind === "pay") { S.money -= 3; P.paid = true; P.left = 2; } else { S.hand.push({ id: nid(), m: arg, bought: true }); if (--P.left <= 0) S.pending = null; } }

    return "";
  },
  fill() { for (const b of S.brew) b.filled = Math.min(SAKE[b.id].gauge, b.filled + planned(b.id)); },
  ship() {
    const done = S.brew.filter(b => b.filled >= SAKE[b.id].gauge).sort((a, b) => SAKE[b.id].rev * decayRate(b.id) - SAKE[a.id].rev * decayRate(a.id));

    for (const b of done) {
      const s = SAKE[b.id], rate = decayRate(b.id); let v = s.rev * rate; const calc = [`${s.rev}両`];

  discard(ids) { for (const id of ids) { const i = S.hand.findIndex(c => c.id === id); const [c] = S.hand.splice(i, 1); if (!c.bought) S.discard.push(c.m); } },

};

    g.fillStyle(missing ? 0xF4DAD4 : 0xFFFFFF, 1); g.fillRoundedRect(-26, -32, 52, 64, 6); g.lineStyle(missing ? 2 : 1, missing ? C.shu : 0xD8D5CA, 1); g.strokeRoundedRect(-26, -32, 52, 64, 6);
    g.fillStyle(band, 1); g.fillRoundedRect(-26, -32, 52, 7, { tl: 6, tr: 6, bl: 0, br: 0 });
    c.add(g); c.add(this.text(0, -4, m === "麹" ? "麹" : m === "酵母" ? "酵" : "米", 22, T.sumi, { font: F.brush, ox: .5, oy: .5 }));
    c.add(this.text(0, 20, m === "米" ? "どの米でも" : m, 9, T.dim, { ox: .5, oy: .5 }));
    return c;
  }
  drawRecruitModal(M) {
    const p = S.field.find(x => x.id === M.id); if (!p) { this.modal = null; return; }
    const r = ROLES[p.role];
    this.scrim(() => this.close());
    const c = this.keep(this.cardBox(W / 2, H / 2, 380, 380, { r: 14 })).setDepth(810);
    c.add(this.koma(-130, -110, p, 1.8));
    c.add(this.text(-80, -150, p.role, 30, T.sumi, { font: F.mincho, bold: true }));
    c.add(this.text(-80, -108, `${p.name}（架空の人物）`, 14, T.dim));
    c.add(this.text(-80, -86, `「${p.line}」`, 14, T.sumi, { wrap: 240 }));
    c.add(this.text(-166, -24, r.kind === "ability" ? "雇っているだけで効く" : "酒の札に置くと", 12, T.dim));
    c.add(this.text(-166, -2, r.eff, 18, T.sumi, { bold: true, wrap: 330 }));
    c.add(this.text(-166, 50, "契約金", 12, T.dim)); c.add(this.koban(-80, 58, r.fee, .9));
    c.add(this.text(-20, 50, "雇った人は手放せず、最後まで毎ターン1両の給料がかかります。", 11, T.dim, { wrap: 190 }));
    c.add(this.button(-70, 140, 160, 40, `${r.fee}両で雇う`, { primary: true, disabled: S.money < r.fee, on: () => this.hireAnimated(p.id) }));
    c.add(this.button(100, 140, 120, 40, "閉じる", { on: () => this.close() }));
    c.setScale(.9); this.tweens.add({ targets: c, scale: 1, duration: 160, ease: "Back.easeOut" });
  }
  drawChoice() {
    const P = S.pending; if (!P) { this.modal = null; return; }
    const ev = S.event;
    this.scrim(null);
    const c = this.keep(this.cardBox(W / 2, H / 2, 560, 330, { r: 14, band: ev.kind === "トラブル" ? C.shu : ev.kind === "選ぶ札" ? C.kinDeep : C.ai })).setDepth(810);
    c.add(this.text(-250, -130, `${ev.kind} ・ イベント`, 12, T.dim));
    c.add(this.text(-250, -110, ev.title, 28, T.sumi, { font: F.mincho, bold: true }));
    c.add(this.text(-250, -66, ev.eff, 16, T.sumi, { wrap: 500 }));
    const done = () => { this.modal = S.pending ? "choice" : null; this.render(); };
    const go = (k, a) => { this.say(Act.resolve(k, a)); done(); };
    let opts = [];
    if (P.type === "pick2" || (P.type === "newrice" && P.paid)) {
      c.add(this.text(-250, -20, `あと${P.left}枚選んでください`, 13, T.dim));
      const list = P.type === "pick2" ? [...RICES, "麹", "酵母"] : RICES;
      list.forEach((m, j) => { const b = this.button(-210 + (j % 4) * 140, 30 + Math.floor(j / 4) * 52, 128, 40, m, { on: () => go(P.type === "pick2" ? "pick" : "rice", m) }); c.add(b); });
    } else {
      if (P.type === "breakdown") { opts = [["2両払う", "pay", null, S.money < 2], ...S.brew.filter(b => b.filled > 0).map(b => [`${SAKE[b.id].name}を1マス戻す`, "mark", b.id, false])]; }
      if (P.type === "interview") opts = [["受ける", "yes"], ["断る", "no"]];
      if (P.type === "newrice") opts = [["3両払う", "pay"], ["見送る", "no"]];
      if (P.type === "tasting") opts = [["2両払う", "yes"], ["見送る", "no"]];
      opts.forEach(([label, k, a, dis], j) => c.add(this.button(-150 + (j % 2) * 300, 40 + Math.floor(j / 2) * 54, 280, 44, label, { primary: j === 0, disabled: dis, on: () => go(k, a) })));
    }
    c.setScale(.9); this.tweens.add({ targets: c, scale: 1, duration: 180, ease: "Back.easeOut" });
  }
  drawShip() {
    const rs = this.lastShip || [];
    this.scrim(null);
    this.keep(this.text(W / 2, 112, `${S.turn}ターン目の出荷`, 36, T.chalk, { font: F.brush, ox: .5, oy: .5 }).setDepth(810));
    if (!rs.length) this.keep(this.text(W / 2, 300, "このターンに出荷できた酒はありません。", 18, T.chalk, { ox: .5, oy: .5 }).setDepth(810));
    rs.forEach((r, i) => {
      const x = W / 2 + (i - (rs.length - 1) / 2) * 270, y = 310;
      const c = this.keep(this.cardBox(x, y, 250, 270, { r: 14, ring: C.good })).setDepth(820);
      c.add(this.text(-108, -118, "出荷", 12, "#2E6B3A", { bold: true }));
      c.add(this.text(-108, -98, r.s.name, 22, T.sumi, { font: F.mincho, bold: true, wrap: 216 }));
      c.add(this.text(-108, -30, `+${r.v}両`, 36, T.kinDeep, { bold: true }));
      c.add(this.text(-108, 18, r.calc, 11, T.dim, { wrap: 216 }));
      c.add(this.text(-108, 46, r.s.say, 13, T.sumi, { wrap: 216 }));
      c.setScale(0); this.tweens.add({ targets: c, scale: 1, duration: 300, delay: 120 * i, ease: "Back.easeOut", onStart: () => this.particles.explode(18, x, y - 40) });
    });
    const gain = rs.reduce((a, r) => a + r.v, 0), sal = salaryTotal();
    this.keep(this.text(W / 2, 486, `売上 +${gain}両 ／ 給料 −${sal}両（${S.hired.length}人） → ${S.money - sal}両`, 16, S.money - sal < 0 ? T.red : T.chalk, { ox: .5, oy: .5, bold: true }).setDepth(810));
    this.keep(this.button(W / 2, 540, 300, 48, "給料を払って次のターンへ", { primary: false, size: 15, on: () => this.afterShip() })).setDepth(830);
  }
  drawDiscard() {
    const need = S.hand.length - HAND_MAX;
    const g = this.keep(this.add.graphics().setDepth(700)); g.fillStyle(0x060A14, .55); g.fillRect(0, 0, W, 540);
    this.keep(this.text(W / 2, 250, "手札は5枚まで", 34, T.chalk, { font: F.brush, ox: .5, oy: .5 }).setDepth(710));
    this.keep(this.text(W / 2, 300, `捨てる札をあと${need - this.discardSel.length}枚、手札からタップしてください`, 16, T.chalk, { ox: .5, oy: .5 }).setDepth(710));
    this.keep(this.button(W / 2, 360, 260, 46, "捨てて給料を払う", { primary: true, disabled: this.discardSel.length !== need, on: () => { Act.discard(this.discardSel); this.modal = null; this.paySalary(); } })).setDepth(720);
  }

  // ---------- 演出つきの操作 ----------
  startAnimated(id) {
    const s = SAKE[id]; if (!canStart(s)) return;
    this.modal = null; this.render(); this.busy = true;
    const [fx, fy] = this.marketPos[id], [tx, ty] = this.slotPos(S.brew.length);
    const ghost = this.cardBox(fx, fy, 130, 76, { r: 8 }).setDepth(600);
    ghost.add(this.text(0, 0, s.name, 13, T.sumi, { font: F.mincho, bold: true, ox: .5, oy: .5 }));
    const plan = payPlan(s);
    plan.pay.forEach((card, j) => { const i = S.hand.indexOf(card); if (i < 0) return; const [hx, hy] = this.handPos(i, S.hand.length); const m = this.matCard(hx, hy, card.m).setDepth(610); this.tweens.add({ targets: m, x: tx, y: ty, scale: .3, alpha: 0, duration: 420, delay: 60 * j, ease: "Cubic.easeIn", onComplete: () => m.destroy() }); });
    this.tweens.add({ targets: ghost, x: tx, y: ty, scaleX: 220 / 130, scaleY: 248 / 72, duration: 420, ease: "Cubic.easeInOut", onComplete: () => { ghost.destroy(); this.busy = false; this.say(Act.start(id)); this.render(); } });
  }
  hireAnimated(cid) {
    const p = S.field.find(x => x.id === cid); const fee = ROLES[p.role].fee; if (S.money < fee) return;
    this.modal = null; this.render(); this.busy = true;
    const [fx, fy] = this.recruitPos[cid];
    const k = this.koma(fx - 92, fy, p, .8).setDepth(600);
    this.floatText(1140, 54, `−${fee}両`, T.red);
    this.tweens.add({ targets: k, x: 838 + Math.min(5, [...S.hired, ...(S.temp ? [S.temp] : [])].filter(x => !S.assign[x.id]).length) * 46, y: 618, scale: 1, duration: 480, ease: "Cubic.easeInOut",
      onComplete: () => { k.destroy(); this.busy = false; this.say(Act.hire(cid)); this.anim.newKoma = String(p.id); this.render(); } });
  }
  buyAnimated(m, fx, fy) {
    const p = S.freeBuy ? 0 : priceOf(m); if (S.buysLeft <= 0 || S.money < p) return;
    this.busy = true;
    const c = this.matCard(fx, fy, m).setDepth(600).setScale(.5);
    if (p) this.floatText(1140, 54, `−${p}両`, T.red);
    const [hx, hy] = this.handPos(S.hand.length, S.hand.length + 1);
    this.tweens.add({ targets: c, x: hx, y: hy, scale: 1, duration: 380, ease: "Cubic.easeOut", onComplete: () => { c.destroy(); this.busy = false; this.say(Act.buy(m)); this.render(); } });
  }
  advanceAnimated() {
    if (this.busy || this.modal) return;
    if (S.over) return;
    if (S.pending) { this.openChoice(); return; }
    this.busy = true; S.selected = null;
    const from = {}; S.brew.forEach(b => from[b.id] = b.filled);
    Act.fill(); this.anim.marbles = from; this.render();
    const ready = S.brew.filter(b => b.filled >= SAKE[b.id].gauge).map(b => b.id);
    this.time.delayedCall(ready.length ? 650 : 450, () => {
      ready.forEach((id, i) => { const c = this.slotCards[id]; if (!c) return; c.setDepth(600);
        this.tweens.add({ targets: c, x: W / 2 + (i - (ready.length - 1) / 2) * 120, y: 300, scale: .7, alpha: .0, duration: 420, ease: "Cubic.easeIn" });
        this.particles.explode(14, c.x, c.y); });
      this.time.delayedCall(ready.length ? 380 : 0, () => {
        this.lastShip = Act.ship();
        this.lastShip.forEach(r => this.floatText(1140, 60, `+${r.v}両`, "#F3D27A"));
        this.busy = false; this.modal = "ship"; this.render();
      });
    });
  }
  afterShip() {
    this.modal = null;
    if (S.hand.length > HAND_MAX) { this.modal = "discard"; this.discardSel = []; this.render(); return; }
    this.paySalary();
  }
  paySalary() {
    const before = S.hand.length, sal = salaryTotal();
    this.render(); this.busy = true;
    this.floatText(1140, 54, `給料 −${sal}両`, T.red);
    this.time.delayedCall(350, () => {
      Act.salary(); this.busy = false;
      if (S.over) { this.render(); showEnd(); return; }
      this.anim.flip = true; this.anim.dealt = Math.max(0, S.hand.length - before);
      this.render(); this.banner(`${S.turn}ターン目`);
      if (S.pending) this.time.delayedCall(900, () => this.openChoice());
    });
  }
}

// =====================================================================
// HTML で重ねる画面（遊び方・結果）
// =====================================================================
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const overlay = document.getElementById("overlay");
function closeOverlay() { overlay.innerHTML = ""; }
function scene() { return game.scene.getScene("board"); }
function showHelp() {
  overlay.innerHTML = `<div class="overlay" data-x="close"><div class="panel" role="dialog" aria-modal="true" aria-label="遊び方">
    <h2>遊び方</h2><p>20ターン後の所持金が点数です。給料を払えなくなったら廃業です。</p>
    <ol><li>イベント札が1枚めくれ、すぐ効く</li><li>山札から2枚引く</li><li>求人の場の札をタップして雇う</li><li>取引先の早見表から素材を2枚まで買う</li><li>光っている酒の場の札をタップして仕込む（3枚まで）</li><li>詰所の駒を酒の札へドラッグして置く（タップしてから札をタップでもよい）</li><li>金色の「仕込む」でおはじきが埋まり、埋まりきった酒が出荷される</li><li>給料を1人1両払う</li></ol>
    <p class="note">蔵人はどの酒でも1マス。酛屋・船頭・蔵守は得意な酒で2マス、ほかでは0。金色の駒は置かなくても効く。同じ酒の2回目は80%、3回目から60%。置いた駒は次のターンもそのまま残る。</p>
    <p class="note">ハッカソンの試作です。岩瀬酒造の公式のものではありません。数字はすべて仮です。</p>
    <div class="btns"><button class="btn" data-x="close">盤面に戻る</button><button class="btn light" data-x="new">1ターン目から始める</button><button class="btn light" data-x="sample">7ターン目の見本に戻す</button></div></div></div>`;
}
function showEnd() {
  const o = S.over, counts = {}; S.log.forEach(x => counts[x.id] = (counts[x.id] || 0) + 1);
  const rank = RANKS.find(([min]) => S.money >= min)[1];
  const names = Object.keys(counts).map(id => SAKE[id].name).join("、") || "なし";
  const share = o.kind === "finish" ? `岩瀬酒造 蔵元カードゲーム（試作）で20ターン。所持金${S.money}両、ランク${rank}。造った酒: ${names}` : `岩瀬酒造 蔵元カードゲーム（試作）で${o.turn}ターン目に廃業。造った酒: ${names}`;
  overlay.innerHTML = `<div class="overlay"><div class="panel" role="dialog" aria-modal="true" aria-label="結果">
    <h2>${o.kind === "finish" ? "二十ターン、お疲れさまでした" : `${o.turn}ターン目で廃業`}</h2>
    ${o.kind === "finish" ? `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><span class="big">${S.money}両</span><span class="rank">ランク ${rank}</span><span class="note">ランクの基準は仮です</span></div>` : `<p>給料を払えませんでした。</p>`}
    <div class="zukan">${Object.keys(counts).map(id => `<div><b>${esc(SAKE[id].name)}</b>${counts[id]}回出荷 ・ ${esc(SAKE[id].say)}</div>`).join("") || "<div>出荷した酒はありません。</div>"}</div>
    <p class="note">ここで造った酒は <a href="${SHOP_URL}" target="_blank" rel="noopener">岩の井 蔵元直送ショップ</a> で買えます。ゲームの中では購入を扱いません。20歳未満の者の飲酒は法律で禁止されています。</p>
    <textarea id="share-text" class="share" readonly aria-label="結果を共有する文章">${esc(share)}</textarea>
    <div class="btns"><button class="btn" data-x="copy">文章ごとコピー</button><button class="btn light" data-x="new">もう一度遊ぶ</button></div></div></div>`;
}
overlay.addEventListener("click", e => {
  const el = e.target.closest("[data-x]"); if (!el) return; const x = el.dataset.x;
  if (x === "close" && el.classList.contains("overlay") && e.target !== el) return;
  if (x === "close") closeOverlay();
  if (x === "new") { closeOverlay(); newGame(Math.floor(Math.random() * 1e9)); const sc = scene(); sc.modal = null; sc.anim = { flip: true, dealt: 5 }; sc.render(); sc.banner("1ターン目"); if (S.pending) sc.time.delayedCall(900, () => sc.openChoice()); }
  if (x === "sample") { closeOverlay(); sampleGame(); const sc = scene(); sc.modal = null; sc.render(); }
  if (x === "copy") { const ta = document.getElementById("share-text"); try { navigator.clipboard.writeText(ta.value).then(() => (el.textContent = "コピーしました"), () => ta.select()); } catch { ta.select(); } }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && overlay.innerHTML) { if (!S.over) closeOverlay(); } });

// =====================================================================
// 起動（字体を読み込んでから盤面を作る）
// =====================================================================
let game;
sampleGame();
const fonts = ['28px "Yuji Syuku"', '800 20px "Shippori Mincho B1"', '14px "Zen Kaku Gothic New"', 'bold 14px "Zen Kaku Gothic New"'];
const ready = Promise.race([Promise.all(fonts.map(f => document.fonts.load(f, "岩の井蔵元仕込む米麹酵両"))), new Promise(r => setTimeout(r, 3500))]);
ready.then(() => {
  document.getElementById("loading").remove();
  game = new Phaser.Game({ type: Phaser.AUTO, parent: "game", backgroundColor: "#0F1829", width: W * DPR, height: H * DPR,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH }, scene: [Board], banner: false });
});
})();
</script>
