<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>岩瀬酒造 蔵元カードゲーム</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 卓の考え方: 酒屋の前掛けの紺の帆布を卓に見立て、和紙の札を置く。
   960×540 の盤面をそのまま縮めて画面に合わせる。左にイベント、中央の上に酒の場、中央に自分の蔵の大きな札3枚、
   右に求人の場と取引先の早見表、下に山札・手札・詰所（駒）・進めるボタン。
   人は将棋の駒、お金は小判、仕込みのマスはおはじき。盤面は一つの見た目に決め打ちする（紺の卓）。 */
:root {
  color-scheme: dark;
  --cloth: #1A2944;        /* 前掛けの紺 */
  --cloth-2: #213354;
  --cloth-deep: #121D33;
  --thread: rgba(255, 255, 255, .06);
  --chalk: #E9ECF2;        /* 卓の上の白い文字 */
  --chalk-dim: #A9B4C7;
  --washi: #F2F1EB;        /* 札の地 */
  --washi-2: #E7E5DC;
  --sumi: #1C1E22;
  --sumi-dim: #5A5D63;
  --shu: #C2412A;          /* 朱: トラブル、判子 */
  --kin: #E1B243;          /* 小判 */
  --kin-deep: #8E6A14;
  --sugi: #5D7A38;         /* 杉玉の緑 */
  --ai: #2F5E96;           /* 藍: おはじき */
  --glow: #F3D27A;         /* 置ける場所、仕込める札 */
  --wood: #D3A96E;         /* 駒 */
  --wood-deep: #8B6234;
  --scrim: rgba(8, 12, 22, .66);
  --display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --brush: "Yuji Syuku", "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--cloth-deep); color: var(--chalk); font-family: var(--body); font-size: 13px; line-height: 1.45; overflow: hidden; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

.viewport { height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; display: grid; place-items: center; }
.frame { position: relative; width: calc(960px * var(--s, 1)); height: calc(540px * var(--s, 1)); }
.stage {
  position: absolute; left: 0; top: 0; width: 960px; height: 540px; transform: scale(var(--s, 1)); transform-origin: 0 0;
  background:
    repeating-linear-gradient(0deg, var(--thread) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, var(--thread) 0 1px, transparent 1px 4px),
    radial-gradient(120% 90% at 50% 40%, var(--cloth-2), var(--cloth) 60%, var(--cloth-deep));
  border-radius: 14px; box-shadow: 0 18px 40px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(255, 255, 255, .06);
  display: grid; grid-template-columns: 188px 1fr 232px; grid-template-rows: 40px 1fr 118px; gap: 8px; padding: 8px 12px;
  overflow: hidden;
}
.rotate { position: fixed; left: 0; right: 0; top: 0; padding: calc(8px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); text-align: center; font-size: 13px; color: var(--chalk); background: var(--cloth); z-index: 5; }
@media (orientation: landscape) { .rotate { display: none; } }

/* 上: 屋号、ターンの道のり、小判 */
.top { grid-column: 1 / -1; display: grid; grid-template-columns: 188px 1fr 232px; gap: 8px; align-items: center; }
.yago { display: flex; align-items: baseline; gap: 6px; }
.yago b { font-family: var(--brush); font-weight: 400; font-size: 22px; letter-spacing: .08em; }
.yago span { font-size: 10px; color: var(--chalk-dim); }
.track { display: flex; align-items: center; gap: 4px; justify-content: center; }
.track .t { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(255,255,255,.22); font-size: 9px; display: grid; place-items: center; color: var(--chalk-dim); }
.track .t.past { background: rgba(255,255,255,.12); border-color: transparent; }
.track .t.now { width: 26px; height: 26px; background: var(--kin); border-color: var(--kin); color: var(--sumi); font-size: 13px; font-weight: 700; box-shadow: 0 0 0 3px rgba(225,178,67,.3); }
.purse { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
.koban { display: inline-flex; align-items: baseline; justify-content: center; line-height: 30px; white-space: nowrap; min-width: 64px; height: 30px; padding: 0 10px; border-radius: 50%; background: radial-gradient(70% 60% at 40% 35%, #FBE7A6, var(--kin) 60%, var(--kin-deep)); color: var(--sumi); font-weight: 700; font-size: 17px; box-shadow: 0 2px 0 var(--kin-deep); }
.koban small { font-size: 10px; margin-left: 1px; }
.koban.sm { min-width: 40px; height: 22px; line-height: 22px; font-size: 12px; padding: 0 7px; box-shadow: 0 1px 0 var(--kin-deep); }
.wage { font-size: 11px; color: var(--chalk-dim); text-align: right; line-height: 1.25; }
.wage b { color: var(--chalk); font-size: 13px; }
.wage.warn b { color: #FF9C8A; }
.icon-btn { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 8px; padding: 3px 8px; font-size: 11px; }

.zone-label { font-family: var(--brush); font-size: 14px; letter-spacing: .1em; color: var(--chalk); display: flex; justify-content: space-between; align-items: baseline; }
.zone-label small { font-family: var(--body); font-size: 10px; letter-spacing: 0; color: var(--chalk-dim); }

/* 札の共通 */
.card { background: var(--washi); color: var(--sumi); border-radius: 8px; box-shadow: 0 2px 0 rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.28); position: relative; }
.back { border-radius: 8px; background:
  radial-gradient(circle at 50% 48%, #7D9B4C 0 17px, #4E6A2C 18px 21px, transparent 22px),
  repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 2px, transparent 2px 8px), #263B63;
  border: 2px solid #3A5384; box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.stack { position: relative; }
.stack .back { position: absolute; inset: 0; }
.stack .back:nth-child(1) { transform: translate(4px, 4px); }
.stack .back:nth-child(2) { transform: translate(2px, 2px); }
.count { position: absolute; right: -6px; bottom: -6px; background: var(--sumi); color: var(--chalk); border: 1px solid rgba(255,255,255,.3); border-radius: 999px; font-size: 10px; padding: 0 6px; z-index: 2; }

/* 左: イベント */
.left { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.ev-row { display: flex; gap: 8px; align-items: flex-start; }
.ev-pool { width: 44px; height: 62px; flex: 0 0 auto; }
.ev-card { flex: 1; padding: 8px 9px 9px; display: flex; flex-direction: column; gap: 4px; border-top: 6px solid var(--ai); min-width: 0; }
.ev-card.trouble { border-top-color: var(--shu); }
.ev-card.choice { border-top-color: var(--kin-deep); }
.ev-kind { font-size: 9px; letter-spacing: .12em; color: var(--sumi-dim); }
.ev-title { font-family: var(--display); font-weight: 800; font-size: 15px; line-height: 1.25; }
.ev-eff { font-size: 11px; line-height: 1.4; }
.ev-origin { font-size: 9px; color: var(--sumi-dim); line-height: 1.35; border-top: 1px dashed var(--washi-2); padding-top: 4px; }
.ev-btns { display: flex; flex-wrap: wrap; gap: 4px; }
.chip-btn { font-size: 10px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--sumi); background: var(--washi); color: var(--sumi); }
.chip-btn.solid { background: var(--sumi); color: var(--washi); }
.chip-btn:disabled { opacity: .4; cursor: not-allowed; }
.effects { display: flex; flex-direction: column; gap: 4px; }
.effect { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--chalk); background: rgba(255,255,255,.07); border-radius: 999px; padding: 2px 8px 2px 2px; }
.effect i { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 10px; color: var(--sumi); background: var(--glow); flex: 0 0 auto; }
.effect.bad i { background: #FF9C8A; }
.hint { font-size: 10.5px; color: var(--chalk-dim); line-height: 1.45; margin-top: auto; }

/* 中央 */
.center { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
.market { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
.mini { padding: 4px 6px 5px; text-align: left; border: 0; display: grid; grid-template-rows: auto 1fr auto; gap: 2px; height: 52px; min-width: 0; }
.mini .nm { font-family: var(--display); font-weight: 800; font-size: 10.5px; line-height: 1.15; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.mini .meta { display: flex; justify-content: space-between; align-items: center; gap: 3px; }
.mini .rev { font-weight: 700; font-size: 11px; color: var(--kin-deep); }
.mini .pips { display: flex; gap: 2px; }
.pip { width: 11px; height: 11px; border-radius: 3px; font-size: 7.5px; display: grid; place-items: center; color: #fff; }
.pip.r { background: var(--kin-deep); } .pip.k { background: var(--sugi); } .pip.y { background: var(--ai); }
.mini .len { font-size: 9px; color: var(--sumi-dim); }
.mini.can { box-shadow: 0 0 0 2px var(--glow), 0 2px 0 rgba(0,0,0,.25); }
.mini.busy { opacity: .45; }

.brewery { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; min-height: 0; }
.slot { border: 2px dashed rgba(255,255,255,.22); border-radius: 10px; display: grid; place-items: center; color: var(--chalk-dim); font-size: 12px; background: rgba(0,0,0,.08); }
.sake { display: grid; grid-template-columns: 34px 1fr; gap: 6px; padding: 8px 8px 8px 6px; border: 0; text-align: left; height: 100%; min-height: 0; }
.sake.target { box-shadow: 0 0 0 3px var(--glow), 0 6px 14px rgba(0,0,0,.3); cursor: pointer; }
.sake.ready { box-shadow: 0 0 0 3px #9BD08F, 0 6px 14px rgba(0,0,0,.3); }
.vname { writing-mode: vertical-rl; text-orientation: upright; font-family: var(--display); font-weight: 800; font-size: 17px; line-height: 1.05; letter-spacing: .06em; border-right: 1px solid var(--washi-2); padding-right: 4px; overflow: hidden; }
.sake-body { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.sake-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; }
.stamps { display: flex; flex-wrap: wrap; gap: 3px; }
.stamp { font-size: 9px; padding: 0 4px; border: 1px solid var(--shu); color: var(--shu); border-radius: 2px; line-height: 1.5; }
.stamp.spec { border-color: var(--sumi-dim); color: var(--sumi-dim); }
.rate { font-size: 9px; color: var(--sumi-dim); text-align: right; }
.marbles { display: grid; grid-template-columns: repeat(4, 22px); gap: 5px; }
.marble { width: 22px; height: 22px; border-radius: 50%; border: 1.5px dashed #B9B7AD; }
.marble.on { border: 0; background: radial-gradient(circle at 34% 30%, #E9F3FF 0 12%, #7FB0E3 30%, var(--ai) 70%, #1C3E6B); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.marble.ghost { border: 2px solid var(--glow); background: rgba(243,210,122,.25); }
.left-n { font-size: 10px; color: var(--sumi-dim); }
.tray { margin-top: auto; min-height: 44px; border-radius: 6px; background: var(--washi-2); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 4px; }
.tray .empty { font-size: 10px; color: var(--sumi-dim); padding-left: 2px; }
.quit { position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(0,0,0,.2); background: var(--washi); color: var(--sumi-dim); font-size: 12px; line-height: 1; z-index: 3; }
.quit.sure { width: auto; padding: 0 8px; border-radius: 999px; background: var(--shu); color: #fff; font-size: 10px; }

/* 右: 求人と取引先 */
.right { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.recruit-row { display: flex; gap: 6px; }
.r-pool { width: 26px; flex: 0 0 auto; }
.r-cards { flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.rcard { display: grid; grid-template-columns: 34px 1fr auto; gap: 6px; align-items: center; padding: 4px 6px; border: 0; text-align: left; min-width: 0; }
.rcard .who { min-width: 0; }
.rcard .role { font-weight: 700; font-size: 12px; }
.rcard .eff { font-size: 9.5px; color: var(--sumi-dim); line-height: 1.3; }
.rcard:disabled { opacity: .55; cursor: not-allowed; }
.refresh { align-self: flex-end; font-size: 10px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); border-radius: 999px; padding: 1px 10px; }
.refresh:disabled { opacity: .4; cursor: not-allowed; }
.board { background: var(--washi); color: var(--sumi); border-radius: 8px; padding: 6px 8px; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.board h3 { margin: 0 0 2px; font-family: var(--brush); font-weight: 400; font-size: 13px; letter-spacing: .1em; display: flex; justify-content: space-between; }
.board h3 small { font-family: var(--body); font-size: 9.5px; color: var(--sumi-dim); letter-spacing: 0; }
.board .rows { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px 8px; }
.buy { display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 11px; background: transparent; border: 0; border-bottom: 1px dotted var(--washi-2); padding: 2px 0; text-align: left; }
.buy:disabled { opacity: .4; cursor: not-allowed; }
.buy .p { font-weight: 700; color: var(--kin-deep); }
.buy .p.up { color: var(--shu); }

/* 駒（人） */
.koma { width: 32px; height: 36px; flex: 0 0 auto; display: grid; place-items: center; padding-top: 4px; font-family: var(--brush); font-size: 17px; color: var(--sumi); border: 0;
  clip-path: polygon(50% 0, 92% 18%, 100% 100%, 0 100%, 8% 18%);
  background: linear-gradient(160deg, #EBC98F, var(--wood) 45%, var(--wood-deep)); }
.koma.sm { width: 26px; height: 30px; font-size: 14px; }
.koma.ability { background: linear-gradient(160deg, #F6E3A4, var(--kin) 50%, var(--kin-deep)); }
.koma.temp { background: linear-gradient(160deg, #DDE6F2, #A9BBD4 50%, #6B83A6); }
.koma-wrap { display: inline-flex; flex-direction: column; align-items: center; gap: 1px; background: transparent; border: 0; padding: 0; }
.koma-wrap .pl { font-size: 8.5px; color: var(--chalk-dim); white-space: nowrap; }
.koma-wrap.sel .koma { transform: translateY(-6px); filter: drop-shadow(0 0 4px var(--glow)) drop-shadow(0 4px 2px rgba(0,0,0,.4)); }
.koma-wrap .gain { font-size: 9px; font-weight: 700; color: var(--sumi); }
.tray .koma-wrap .pl { color: var(--sumi-dim); }

/* 下 */
.bottom { grid-column: 1 / -1; display: grid; grid-template-columns: 188px 1fr 250px 104px; gap: 10px; align-items: end; }
.decks { display: flex; gap: 14px; align-items: flex-end; padding-bottom: 4px; }
.deck { width: 52px; height: 72px; }
.deck-label { font-size: 9.5px; color: var(--chalk-dim); text-align: center; margin-top: 6px; }
.discard-top { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 12px; writing-mode: vertical-rl; text-orientation: upright; }
.hand-zone { display: flex; flex-direction: column; gap: 2px; min-width: 0; height: 100%; }
.hand { flex: 1; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 2px; }
.mat { width: 56px; height: 78px; margin: 0 -5px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-top: 7px solid var(--kin-deep); transform-origin: 50% 120%; }
.mat.k { border-top-color: var(--sugi); } .mat.y { border-top-color: var(--ai); }
.mat .big { font-family: var(--brush); font-size: 24px; line-height: 1; }
.mat .sub { font-size: 9px; color: var(--sumi-dim); white-space: nowrap; }
.mat.over { box-shadow: 0 0 0 2px #FF9C8A, 0 6px 14px rgba(0,0,0,.28); }
.crew { height: 100%; border-radius: 10px; background: rgba(0,0,0,.18); border: 1px solid rgba(255,255,255,.08); padding: 4px 8px 6px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.crew-row { flex: 1; display: flex; flex-wrap: wrap; gap: 6px 8px; align-content: center; }
.go { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 2px; }
.go-btn { width: 84px; height: 84px; border-radius: 50%; border: 0; background: radial-gradient(circle at 40% 32%, #FFF1C2, var(--kin) 55%, var(--kin-deep)); color: var(--sumi); box-shadow: 0 4px 0 #5E4508, 0 10px 18px rgba(0,0,0,.4); display: grid; place-items: center; text-align: center; line-height: 1.15; }
.go-btn b { font-family: var(--brush); font-weight: 400; font-size: 20px; display: block; }
.go-btn small { font-size: 9.5px; display: block; }
.go-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #5E4508, 0 6px 12px rgba(0,0,0,.4); }
.go-btn:disabled { filter: grayscale(.6); opacity: .6; cursor: not-allowed; }
.phase { font-size: 9.5px; color: var(--chalk-dim); text-align: center; line-height: 1.3; }

/* 重ねる層 */
.layer { position: absolute; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 20; border-radius: 14px; }
.panel { background: var(--washi); color: var(--sumi); border-radius: 12px; padding: 14px 16px; width: min(620px, 92%); max-height: 92%; overflow: auto; box-shadow: 0 20px 40px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 10px; }
.panel h2 { margin: 0; font-family: var(--brush); font-weight: 400; font-size: 22px; letter-spacing: .08em; }
.ship-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.ship { width: 170px; padding: 10px; display: flex; flex-direction: column; gap: 4px; background: #fff; border-radius: 10px; box-shadow: 0 0 0 2px #9BD08F; }
.ship .nm { font-family: var(--display); font-weight: 800; font-size: 15px; line-height: 1.25; }
.ship .v { font-size: 24px; font-weight: 700; color: var(--kin-deep); }
.ship .calc { font-size: 10px; color: var(--sumi-dim); }
.ship .say { font-size: 11.5px; }
.ledger { display: flex; justify-content: space-between; border-top: 1px dashed var(--washi-2); padding-top: 6px; font-size: 13px; }
.cta { align-self: center; border: 0; border-radius: 999px; background: var(--sumi); color: var(--washi); padding: 8px 22px; font-weight: 700; }
.cta:disabled { opacity: .4; cursor: not-allowed; }
.cta.light { background: transparent; color: var(--sumi); border: 1px solid var(--sumi); }
.pick-hand { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.pick-hand .mat { margin: 0; cursor: pointer; }
.pick-hand .mat.picked { transform: translateY(-8px); box-shadow: 0 0 0 3px var(--shu), 0 6px 14px rgba(0,0,0,.28); }
.end-head { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.end-money { font-size: 40px; font-weight: 700; color: var(--kin-deep); line-height: 1; }
.rank { font-family: var(--brush); font-size: 30px; }
.zukan { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
.zukan div { background: #fff; border-radius: 8px; padding: 6px 8px; font-size: 11px; }
.zukan b { font-family: var(--display); font-size: 13px; display: block; }
.note { font-size: 10.5px; color: var(--sumi-dim); }
.share { width: 100%; min-height: 54px; font: inherit; font-size: 12px; border: 1px solid var(--washi-2); border-radius: 8px; padding: 6px; background: #fff; color: var(--sumi); resize: none; }
.shop-link { color: var(--ai); font-weight: 700; }
.toast { position: absolute; left: 50%; bottom: 128px; transform: translateX(-50%); background: var(--sumi); color: var(--washi); font-size: 12px; padding: 6px 14px; border-radius: 999px; z-index: 30; box-shadow: 0 6px 14px rgba(0,0,0,.4); white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
.rules { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 12px; }
.disclaimer { font-size: 10px; color: var(--sumi-dim); }
@media (prefers-reduced-motion: no-preference) {
  .koma-wrap .koma, .mat, .go-btn { transition: transform .15s ease; }
  .marble.on { animation: drop .25s ease-out; }
  @keyframes drop { from { transform: scale(.4); opacity: .3; } to { transform: none; opacity: 1; } }
  .panel { animation: pop .2s ease-out; }
  @keyframes pop { from { transform: scale(.96); opacity: .5; } to { transform: none; opacity: 1; } }
}
</style>

<script>
(() => {

    { id: "fusa", name: "i240 総の舞", needs: { "総の舞": 1, "麹": 1, "酵母": 1 }, gauge: 2, rev: 7, spec: "船頭", tags: ["i240"], say: "千葉県でしか栽培されていない酒米で造る。" },

    { id: "yamahai240", name: "i240 山廃・山田錦", needs: { "山田錦": 1, "麹": 1, "酵母": 1 }, gauge: 4, rev: 12, spec: "酛屋", tags: ["i240", "山廃"], say: "全国燗酒コンテスト2024金賞。" },
    { id: "daiginjo", name: "山廃純米大吟醸", needs: { "山田錦": 2, "麹": 1 }, gauge: 6, rev: 18, spec: "酛屋", tags: ["山廃"], say: "ロバート・パーカーの評価で95点（2017年）。" },

  const SAKE = Object.fromEntries(SAKES.map(s => [s.id, s]));
  const ROLES = {

    "船頭": { fee: 4, kind: "spec", k: "船", eff: "i240・中汲みで2マス" },
    "蔵守": { fee: 4, kind: "spec", k: "守", eff: "古酒で2マス" },
    "麹屋": { fee: 4, kind: "ability", k: "麹", eff: "麹が1枚少なくて済む" },
    "仕入れ係": { fee: 4, kind: "ability", k: "仕", eff: "毎ターン1枚多く引く" },
    "帳場": { fee: 4, kind: "ability", k: "帳", eff: "取引先で1枚無料" },
    "営業": { fee: 4, kind: "ability", k: "営", eff: "値下がりが1段ゆるい" },
  };
  const RECRUITS = [
    ["蔵人", "大原 拓"], ["蔵人", "勝浦 ひなた"], ["蔵人", "布施 健吾"], ["蔵人", "鵜原 奈央"], ["蔵人", "岩和田 大地"], ["蔵人", "白浜 律"],
    ["酛屋", "関 正造"], ["酛屋", "堀田 早苗"], ["船頭", "浜野 修"], ["船頭", "川名 透"], ["蔵守", "古川 静"], ["蔵守", "蔵持 栄一"],
    ["麹屋", "室井 恵"], ["仕入れ係", "米倉 賢"], ["帳場", "吉野 由紀"], ["営業", "早瀬 航"],
  ];
  const FIRST_CREW = [["蔵人", "浜田 湊"], ["蔵人", "岩崎 しのぶ"]];
  const EVENTS = [
    { id: "summit", w: 1, kind: "嬉しいこと", title: "サミットの乾杯酒", eff: "次に出荷する酒の売上が1.5倍", origin: "1986年の東京サミットの晩餐会で乾杯酒に選ばれた", buff: { k: "mult", v: 1.5, label: "次の出荷 ×1.5" } },
    { id: "bishu", w: 1, kind: "嬉しいこと", title: "美酒アワードの三ツ星", eff: "次に出荷するi240の売上が1.5倍", origin: "i240 五百万石が2026年にフレンチ部門で三ツ星", buff: { k: "mult", v: 1.5, tag: "i240", label: "次のi240 ×1.5" } },
    { id: "kanzake", w: 1, kind: "嬉しいこと", title: "燗酒コンテスト金賞", eff: "次に出荷する山廃の酒の売上が1.5倍", origin: "山廃純米辛口（2021年）とi240 山廃・山田錦（2024年）が金賞", buff: { k: "mult", v: 1.5, tag: "山廃", label: "次の山廃 ×1.5" } },
    { id: "parker", w: 1, kind: "嬉しいこと", title: "パーカーポイント95点", eff: "次に出荷する山廃純米大吟醸の売上が2倍", origin: "山廃純米大吟醸が2017年に95点", buff: { k: "mult", v: 2, only: "daiginjo", label: "次の大吟醸 ×2" } },
    { id: "crowd", w: 1, kind: "嬉しいこと", title: "クラファン大成功", eff: "好きな素材を2枚、無料でもらえる", origin: "2026年の古酒のクラウドファンディングが、目標30万円に対し約229万円を集めた" },
    { id: "nanbu", w: 2, kind: "嬉しいこと", title: "南部から応援", eff: "このターンだけ蔵人が1人増える（給料なし）", origin: "南部から来た蔵人が仕込みをしている" },
    { id: "export", w: 2, kind: "嬉しいこと", title: "海外の商談がまとまる", eff: "すぐ5両もらう", origin: "海外への出荷に取り組んでいる" },
    { id: "magazine", w: 2, kind: "嬉しいこと", title: "雑誌に載る", eff: "次に出荷する酒の売上が3両増える", origin: "架空", buff: { k: "add", v: 3, label: "次の出荷 +3両" } },
    { id: "harvest", w: 2, kind: "嬉しいこと", title: "米がよく取れた", eff: "山札から2枚引く", origin: "架空" },
    { id: "visit", w: 2, kind: "嬉しいこと", title: "蔵見学のお客さん", eff: "すぐ2両もらう", origin: "架空" },
    { id: "riceup", w: 2, kind: "トラブル", title: "酒米の値上がり", eff: "3ターンの間、取引先の米が2倍", origin: "2026年、酒米の価格が2倍近くに上がった" },
    { id: "breakdown", w: 2, kind: "トラブル", title: "機械の故障", eff: "2両払うか、マスを1つ戻すかを選ぶ", origin: "架空" },
    { id: "typhoon", w: 2, kind: "トラブル", title: "台風で停電", eff: "このターン、置ける人が1人減る", origin: "架空" },
    { id: "quit", w: 2, kind: "トラブル", title: "離職", eff: "一番最近雇った人が辞める", origin: "架空" },
    { id: "badkoji", w: 1, kind: "トラブル", title: "麹の出来が悪い", eff: "手札の麹を1枚捨てる", origin: "架空" },
    { id: "interview", w: 2, kind: "選ぶ札", title: "取材の依頼", eff: "受けると置ける人が1人減り、次の出荷が+4両", origin: "架空" },
    { id: "newrice", w: 2, kind: "選ぶ札", title: "新しい酒米の提案", eff: "3両払えば、好きな米を2枚もらえる", origin: "架空" },
    { id: "tasting", w: 2, kind: "選ぶ札", title: "試飲会への出店", eff: "2両払えば、次の出荷が1.5倍", origin: "架空" },
  ];
  const TURNS = 20, HAND_MAX = 5, BREW_MAX = 3, SALARY = 1;
  const RANKS = [[170, "S"], [140, "A"], [110, "B"], [-Infinity, "C"]]; // 仮
  const SHOP_URL = "https://iwanoi.base.ec/";
  const short = m => ({ "山田錦": "山", "五百万石": "五", "総の舞": "総", "きたしずく": "北", "愛山": "愛" }[m] || m);

  // ---------- 乱数と状態 ----------
  function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function shuffle(arr, R) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
  let S, R, uid = 0; const nid = () => ++uid;
  const isRice = m => RICES.includes(m);

  function baseState(seed) {
    R = rng(seed);
    const deck = shuffle(Object.entries(DECK).flatMap(([m, n]) => Array.from({ length: n }, () => m)), R);
    const rdeck = shuffle(RECRUITS.map(([role, name]) => ({ id: nid(), role, name })), R);
    return { seed, turn: 1, money: 12, deck, discard: [], hand: [], rdeck, rdiscard: [], field: [],
      hired: FIRST_CREW.map(([role, name]) => ({ id: nid(), role, name, at: 0 })),
      brew: [], assign: {}, ships: {}, buff: null, riceUp: 0, event: null, pending: null, temp: null, placeMinus: 0,
      buysLeft: 2, freeBuy: false, kojiFree: false, refreshed: false, log: [], selected: null, confirmQuit: null, over: null, layer: null, hint: "" };
  }
  function drawCard() { if (!S.deck.length) { if (!S.discard.length) return null; S.deck = shuffle(S.discard, R); S.discard = []; } return S.deck.pop(); }
  function fillField() { while (S.field.length < 3) { if (!S.rdeck.length) { if (!S.rdiscard.length) break; S.rdeck = shuffle(S.rdiscard, R); S.rdiscard = []; } S.field.push(S.rdeck.pop()); } }
  const has = role => S.hired.some(p => p.role === role);

  function newGame(seed) { S = baseState(seed); for (let i = 0; i < 3; i++) S.hand.push({ id: nid(), m: drawCard(), bought: false }); fillField(); startTurn(); }
  function sampleGame() {
    S = baseState(7);
    const take = m => { const i = S.deck.indexOf(m); if (i >= 0) S.deck.splice(i, 1); return m; };
    const pick = role => { const i = S.rdeck.findIndex(c => c.role === role); return S.rdeck.splice(i, 1)[0]; };
    S.turn = 7; S.money = 18;
    S.hired.push({ ...pick("酛屋"), at: 3 }, { ...pick("営業"), at: 5 });
    S.field = [pick("蔵守"), pick("蔵人"), pick("船頭")];
    S.brew = [{ id: "karakuchi", filled: 2 }, { id: "fusa", filled: 0 }, { id: "koshu20", filled: 3 }];
    S.ships = { gohyaku: 2, karakuchi: 1, aiyama: 1 };
    S.log = [{ id: "gohyaku", v: 6 }, { id: "aiyama", v: 8 }, { id: "gohyaku", v: 4 }, { id: "karakuchi", v: 12 }];
    ["山田錦", "麹", "酵母", "五百万石"].forEach(m => S.hand.push({ id: nid(), m: take(m), bought: false }));
    for (let i = 0; i < 14; i++) S.discard.push(S.deck.pop());
    S.event = EVENTS.find(e => e.id === "kanzake"); S.buff = { ...S.event.buff };
    S.hint = "7ターン目の見本です。駒をタップしてから、酒の札をタップすると置けます。";
  }
  function startTurn() {
    Object.assign(S, { buysLeft: 2, freeBuy: has("帳場"), kojiFree: has("麹屋"), refreshed: false, placeMinus: 0, temp: null, pending: null, selected: null, confirmQuit: null });
    const total = EVENTS.reduce((a, e) => a + e.w, 0); let r = R() * total, ev = EVENTS[0];
    for (const e of EVENTS) { r -= e.w; if (r < 0) { ev = e; break; } }
    S.event = ev; const note = applyEvent(ev);
    const n = 2 + (has("仕入れ係") ? 1 : 0), got = [];
    for (let i = 0; i < n; i++) { const m = drawCard(); if (m) { S.hand.push({ id: nid(), m, bought: false }); got.push(m); } }
    S.hint = `${got.length ? got.join("・") + "を引きました。" : "山札が尽きました。"}${note ? " " + note : ""}`;
    for (const pid of Object.keys(S.assign)) if (!S.brew.some(b => b.id === S.assign[pid]) || !S.hired.some(p => String(p.id) === pid)) delete S.assign[pid];
  }
  function setBuff(b) { if (S.buff) return "すでに出荷の効果を持っているので、何も起きません。"; S.buff = { ...b }; return ""; }
  function applyEvent(ev) {
    switch (ev.id) {
      case "summit": case "bishu": case "kanzake": case "parker": case "magazine": return setBuff(ev.buff);
      case "crowd": S.pending = { type: "pick2", left: 2 }; return "";
      case "nanbu": S.temp = { id: "temp", role: "蔵人", name: "南部の応援", temp: true }; return "";
      case "export": S.money += 5; return "";
      case "harvest": for (let i = 0; i < 2; i++) { const m = drawCard(); if (m) S.hand.push({ id: nid(), m, bought: false }); } return "";
      case "visit": S.money += 2; return "";
      case "riceup": S.riceUp = 3; return "";
      case "breakdown": if (S.money < 2 && !S.brew.some(b => b.filled > 0)) return "払えず戻すマスもないので、何も起きません。"; S.pending = { type: "breakdown" }; return "";
      case "typhoon": S.placeMinus += 1; return "";
      case "quit": { const later = S.hired.filter(p => p.at > 0); if (!later.length) return "最初の蔵人しかいないので、何も起きません。";
        const last = later.reduce((a, b) => (b.at >= a.at ? b : a)); S.hired = S.hired.filter(p => p !== last); delete S.assign[last.id]; S.rdiscard.push(last); return `${last.role}の${last.name}さんが辞めました。`; }
      case "badkoji": { const i = S.hand.findIndex(c => c.m === "麹"); if (i >= 0) { const [c] = S.hand.splice(i, 1); if (!c.bought) S.discard.push(c.m); return "麹を1枚捨てました。"; } return "麹がないので、何も起きません。"; }
      case "interview": S.pending = { type: "interview" }; return "";
      case "newrice": if (S.money < 3) return "払えないので見送りました。"; S.pending = { type: "newrice" }; return "";
      case "tasting": if (S.money < 2) return "払えないので見送りました。"; S.pending = { type: "tasting" }; return "";
    }
    return "";
  }

  // ---------- 計算 ----------
  const workers = () => [...S.hired.filter(p => ROLES[p.role].kind !== "ability"), ...(S.temp ? [S.temp] : [])];
  const placeLimit = () => Math.max(0, workers().length - S.placeMinus);
  const assignedCount = () => Object.keys(S.assign).length;
  const personOf = pid => pid === "temp" ? S.temp : S.hired.find(p => String(p.id) === String(pid));
  function marksBy(p, sid) { const k = ROLES[p.role].kind; if (k === "any") return 1; if (k === "spec") return SAKE[sid].spec === p.role ? 2 : 0; return 0; }
  function planned(sid) { let n = 0; for (const [pid, s] of Object.entries(S.assign)) if (s === sid) { const p = personOf(pid); if (p) n += marksBy(p, sid); } return n; }
  function decayRate(id) { const n = S.ships[id] || 0; const st = has("営業") ? [1, 1, .8] : [1, .8, .6]; return st[Math.min(n, 2)]; }
  const buffApplies = (b, s) => (!b.tag && !b.only) || (b.tag && s.tags.includes(b.tag)) || b.only === s.id;
  const priceOf = m => PRICE[m] * (S.riceUp > 0 && isRice(m) ? 2 : 1);
  const salaryTotal = () => S.hired.length * SALARY;
  function payPlan(sake) {
    const needs = { ...sake.needs }; if (S.kojiFree && needs["麹"]) needs["麹"] -= 1;
    const pool = [...S.hand], pay = [], miss = [];
    for (const m of ["麹", "酵母", ...RICES]) for (let i = 0; i < (needs[m] || 0); i++) { const j = pool.findIndex(c => c.m === m); if (j >= 0) pay.push(pool.splice(j, 1)[0]); else miss.push(m); }
    for (let i = 0; i < (needs.ANY || 0); i++) { const c = pool.filter(c => isRice(c.m)).sort((a, b) => (a.m === "山田錦") - (b.m === "山田錦"))[0]; if (c) { pay.push(c); pool.splice(pool.indexOf(c), 1); } else miss.push("米"); }
    return { pay, miss, kojiSaved: S.kojiFree && sake.needs["麹"] > 0 };
  }
  const pipsOf = s => Object.entries(s.needs).flatMap(([m, n]) => Array.from({ length: n }, () => m === "ANY" ? ["r", "米"] : m === "麹" ? ["k", "麹"] : m === "酵母" ? ["y", "酵"] : ["r", short(m)]));

  // ---------- 操作 ----------
  function toast(msg) { const el = document.getElementById("toast"); el.innerHTML = `<div class="toast" role="status">${msg}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => (el.innerHTML = ""), 2600); }
  const blocked = () => { if (S.over || S.layer) return true; if (S.pending) { toast("先にイベント札で選んでください。"); return true; } return false; };
  function hire(cid) { if (blocked()) return; const i = S.field.findIndex(c => c.id === cid); const c = S.field[i]; const fee = ROLES[c.role].fee;
    if (S.money < fee) return toast("契約金が足りません。"); S.money -= fee; S.field.splice(i, 1); S.hired.push({ ...c, at: S.turn }); fillField();
    toast(`${c.role}の${c.name}さんを雇いました。給料は毎ターン1両。`); render(); }
  function refreshField() { if (blocked()) return; if (S.refreshed || S.money < 1) return; S.money -= 1; S.refreshed = true; S.rdiscard.push(...S.field); S.field = []; fillField(); render(); }
  function buy(m) { if (blocked()) return; if (S.buysLeft <= 0) return toast("取引先は1ターン2枚までです。"); const p = S.freeBuy ? 0 : priceOf(m);
    if (S.money < p) return toast("お金が足りません。"); S.money -= p; S.freeBuy = false; S.buysLeft -= 1; S.hand.push({ id: nid(), m, bought: true }); render(); }
  function startSake(id) {
    if (blocked()) return; const s = SAKE[id];
    if (S.brew.some(b => b.id === id)) return toast("仕込み中です。");
    if (S.brew.length >= BREW_MAX) return toast("自分の蔵は3枚までです。");
    const plan = payPlan(s); if (plan.miss.length) return toast(`${s.name}: ${plan.miss.join("・")}が足りません。`);
    for (const c of plan.pay) { S.hand.splice(S.hand.indexOf(c), 1); if (!c.bought) S.discard.push(c.m); }
    if (plan.kojiSaved) S.kojiFree = false; S.brew.push({ id, filled: 0 }); toast(`${s.name}の仕込みを始めました。`); render();
  }
  function quitSake(id) { if (S.confirmQuit !== id) { S.confirmQuit = id; render(); return; }
    S.brew = S.brew.filter(b => b.id !== id); for (const pid of Object.keys(S.assign)) if (S.assign[pid] === id) delete S.assign[pid]; S.confirmQuit = null; render(); }
  function selectKoma(pid) {
    if (S.over || S.layer) return; const p = personOf(pid); if (!p || ROLES[p.role].kind === "ability") return toast("この人は置かなくても効きます。");
    if (S.assign[pid] && S.selected !== String(pid)) { delete S.assign[pid]; S.selected = String(pid); render(); return; }
    S.selected = S.selected === String(pid) ? null : String(pid); render();
  }
  function placeOn(sid) {
    if (!S.selected) return; const pid = S.selected;
    if (!(pid in S.assign) && assignedCount() >= placeLimit()) { S.selected = null; render(); return toast(`このターン置けるのは${placeLimit()}人までです。`); }
    S.assign[pid] = sid; S.selected = null; const p = personOf(pid); if (marksBy(p, sid) === 0) toast(`${p.role}はこの酒ではマスを埋められません。`); render();
  }
  function resolve(kind, arg) {
    const P = S.pending; if (!P) return;
    if (P.type === "pick2") { S.hand.push({ id: nid(), m: arg, bought: true }); if (--P.left <= 0) S.pending = null; }
    else if (P.type === "breakdown") { if (kind === "pay") S.money -= 2; else { const b = S.brew.find(x => x.id === arg); if (b && b.filled > 0) b.filled -= 1; } S.pending = null; }
    else if (P.type === "interview") { if (kind === "yes") { S.placeMinus += 1; const n = setBuff({ k: "add", v: 4, label: "次の出荷 +4両" }); if (n) toast(n); const keys = Object.keys(S.assign); while (keys.length > placeLimit()) delete S.assign[keys.pop()]; } S.pending = null; }
    else if (P.type === "newrice") { if (kind === "no") S.pending = null; else if (kind === "pay") { S.money -= 3; P.paid = true; P.left = 2; } else { S.hand.push({ id: nid(), m: arg, bought: true }); if (--P.left <= 0) S.pending = null; } }
    else if (P.type === "tasting") { if (kind === "yes") { S.money -= 2; const n = setBuff({ k: "mult", v: 1.5, label: "次の出荷 ×1.5" }); if (n) toast(n); } S.pending = null; }
    render();
  }
  function advance() {
    if (S.over || S.layer) return; if (S.pending) return toast("先にイベント札で選んでください。");
    for (const b of S.brew) b.filled = Math.min(SAKE[b.id].gauge, b.filled + planned(b.id));
    const done = S.brew.filter(b => b.filled >= SAKE[b.id].gauge).sort((a, b) => SAKE[b.id].rev * decayRate(b.id) - SAKE[a.id].rev * decayRate(a.id));
    const results = [];
    for (const b of done) {
      const s = SAKE[b.id], rate = decayRate(b.id); let v = s.rev * rate; const calc = [`${s.rev}両`];
      if (rate < 1) calc.push(`${S.ships[b.id] + 1}回目 ${Math.round(rate * 100)}%`);
      if (S.buff && buffApplies(S.buff, s)) { calc.push(S.buff.label.split(" ").pop()); v = S.buff.k === "mult" ? v * S.buff.v : v + S.buff.v; S.buff = null; }
      v = Math.floor(v); S.money += v; S.ships[b.id] = (S.ships[b.id] || 0) + 1; S.log.push({ id: b.id, v }); results.push({ s, v, calc: calc.join(" → ") });
    }
    S.brew = S.brew.filter(b => !done.includes(b));
    for (const pid of Object.keys(S.assign)) if (!S.brew.some(b => b.id === S.assign[pid])) delete S.assign[pid];
    S.selected = null; S.lastShip = results; S.layer = "ship"; render();
  }
  function afterShip() { if (S.hand.length > HAND_MAX) { S.layer = "discard"; S.discardSel = []; render(); return; } S.layer = null; paySalary(); }
  function doDiscard() {
    const need = S.hand.length - HAND_MAX; if (S.discardSel.length !== need) return;
    for (const id of S.discardSel) { const i = S.hand.findIndex(c => c.id === id); const [c] = S.hand.splice(i, 1); if (!c.bought) S.discard.push(c.m); }
    S.layer = null; paySalary();
  }
  function paySalary() {
    const sal = salaryTotal();
    if (S.money < sal) { S.over = { kind: "bankrupt", turn: S.turn }; S.layer = "end"; render(); return; }
    S.money -= sal; if (S.riceUp > 0) S.riceUp -= 1;
    if (S.turn >= TURNS) { S.over = { kind: "finish" }; S.layer = "end"; render(); return; }
    S.turn += 1; startTurn(); render();
  }

  // ---------- 描画 ----------
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const koban = (v, sm) => `<span class="koban ${sm ? "sm" : ""}">${v}<small>両</small></span>`;
  const komaHtml = (p, opts = {}) => {
    const r = ROLES[p.role]; const cls = p.temp ? "temp" : r.kind === "ability" ? "ability" : "";
    return `<button class="koma-wrap ${S.selected === String(p.id) ? "sel" : ""}" data-act="koma" data-pid="${p.id}" title="${esc(p.role)} ${esc(p.name)}・${esc(r.eff)}" aria-label="${esc(p.role)} ${esc(p.name)}">
      <span class="koma ${opts.sm ? "sm" : ""} ${cls}">${p.temp ? "南" : r.k}</span>${opts.gain != null ? `<span class="gain">+${opts.gain}</span>` : `<span class="pl">${esc(opts.label ?? p.role)}</span>`}</button>`;
  };
  const matCard = (c, extra = "") => `<div class="card mat ${isRice(c.m) ? "" : c.m === "麹" ? "k" : "y"} ${extra}"><span class="big">${isRice(c.m) ? "米" : c.m === "麹" ? "麹" : "酵"}</span><span class="sub">${c.m}</span></div>`;

  function render() {
    const sal = salaryTotal();
    // 上
    document.getElementById("top").innerHTML = `
      <div class="yago"><b>岩の井 蔵元</b><span>試作</span></div>
      <div class="track" aria-label="${S.turn}ターン目、全${TURNS}ターン">${Array.from({ length: TURNS }, (_, i) => `<span class="t ${i + 1 < S.turn ? "past" : ""} ${i + 1 === S.turn ? "now" : ""}">${i + 1 === S.turn || (i + 1) % 5 === 0 ? i + 1 : ""}</span>`).join("")}</div>
      <div class="purse"><div class="wage ${S.money < sal ? "warn" : ""}">次の給料<br><b>${sal}両</b></div>${koban(S.money)}
        <button class="icon-btn" data-act="layer" data-l="help">遊び方</button></div>`;

    // 左: イベント
    const ev = S.event, P = S.pending;
    let btns = "";
    if (P) {
      if (P.type === "pick2") btns = `<span class="ev-kind">あと${P.left}枚</span>` + [...RICES, "麹", "酵母"].map(m => `<button class="chip-btn" data-act="resolve" data-k="pick" data-a="${m}">${m}</button>`).join("");
      if (P.type === "breakdown") btns = `<button class="chip-btn solid" data-act="resolve" data-k="pay" ${S.money < 2 ? "disabled" : ""}>2両払う</button>` + S.brew.filter(b => b.filled > 0).map(b => `<button class="chip-btn" data-act="resolve" data-k="mark" data-a="${b.id}">${esc(SAKE[b.id].name)}を1マス戻す</button>`).join("");
      if (P.type === "interview") btns = `<button class="chip-btn solid" data-act="resolve" data-k="yes">受ける</button><button class="chip-btn" data-act="resolve" data-k="no">断る</button>`;
      if (P.type === "newrice") btns = P.paid ? `<span class="ev-kind">あと${P.left}枚</span>` + RICES.map(m => `<button class="chip-btn" data-act="resolve" data-k="rice" data-a="${m}">${m}</button>`).join("") : `<button class="chip-btn solid" data-act="resolve" data-k="pay">3両払う</button><button class="chip-btn" data-act="resolve" data-k="no">見送る</button>`;
      if (P.type === "tasting") btns = `<button class="chip-btn solid" data-act="resolve" data-k="yes">2両払う</button><button class="chip-btn" data-act="resolve" data-k="no">見送る</button>`;
    }
    const effects = [];
    if (S.buff) effects.push(`<div class="effect"><i>効</i>${esc(S.buff.label)}</div>`);
    if (S.riceUp > 0) effects.push(`<div class="effect bad"><i>米</i>値上がり あと${S.riceUp}ターン</div>`);
    if (S.placeMinus > 0) effects.push(`<div class="effect bad"><i>人</i>置ける人 −${S.placeMinus}</div>`);
    document.getElementById("left").innerHTML = `
      <div class="zone-label">イベント<small>毎ターン1枚</small></div>
      <div class="ev-row"><div class="stack ev-pool" aria-hidden="true"><div class="back"></div><div class="back"></div><div class="back"></div></div>
        <div class="card ev-card ${ev.kind === "トラブル" ? "trouble" : ev.kind === "選ぶ札" ? "choice" : ""}">
          <span class="ev-kind">${ev.kind}</span><span class="ev-title">${esc(ev.title)}</span><span class="ev-eff">${esc(ev.eff)}</span>
          ${btns ? `<div class="ev-btns">${btns}</div>` : ""}
          <span class="ev-origin">${esc(ev.origin)}</span></div></div>
      <div class="effects">${effects.join("")}</div>
      <div class="hint">${esc(S.selected ? `${personOf(S.selected).role}を持っています。置く酒の札をタップ。` : S.hint)}</div>`;

    // 中央: 酒の場と自分の蔵
    const inBrew = new Set(S.brew.map(b => b.id));
    const market = SAKES.map(s => {
      const plan = payPlan(s); const busy = inBrew.has(s.id); const can = !busy && !plan.miss.length && S.brew.length < BREW_MAX;
      return `<button class="card mini ${can ? "can" : ""} ${busy ? "busy" : ""}" data-act="start" data-sake="${s.id}" title="${esc(s.name)}・${s.gauge}マス・${s.say}">
        <span class="nm">${esc(s.name)}</span>
        <span class="meta"><span class="pips">${pipsOf(s).map(([c, t]) => `<span class="pip ${c}">${t}</span>`).join("")}</span><span class="len">${s.gauge}マス</span></span>
        <span class="meta"><span class="len">${busy ? "仕込み中" : s.spec}</span><span class="rev">${Math.floor(s.rev * decayRate(s.id))}両</span></span></button>`;
    }).join("");
    const slots = Array.from({ length: BREW_MAX }, (_, i) => {
      const b = S.brew[i]; if (!b) return `<div class="slot">${S.brew.length < BREW_MAX ? "空き枠<br>上の酒の場から仕込む" : ""}</div>`;
      const s = SAKE[b.id], add = planned(b.id), after = Math.min(s.gauge, b.filled + add), rate = decayRate(b.id);
      const tray = Object.entries(S.assign).filter(([, sid]) => sid === b.id).map(([pid]) => komaHtml(personOf(pid), { sm: true, gain: marksBy(personOf(pid), b.id) })).join("");
      return `<div class="card sake ${S.selected ? "target" : ""} ${after >= s.gauge ? "ready" : ""}" ${S.selected ? `data-act="place" data-sake="${b.id}" role="button" tabindex="0"` : ""}>
        <button class="quit ${S.confirmQuit === b.id ? "sure" : ""}" data-act="quit" data-sake="${b.id}" aria-label="仕込みをやめる">${S.confirmQuit === b.id ? "やめる" : "×"}</button>
        <div class="vname">${esc(s.name)}</div>
        <div class="sake-body">
          <div class="sake-head"><div class="stamps">${s.tags.map(t => `<span class="stamp">${t}</span>`).join("")}<span class="stamp spec">得意 ${s.spec}</span></div>
            <div>${koban(Math.floor(s.rev * rate), true)}<div class="rate">${rate < 1 ? `${(S.ships[b.id] || 0) + 1}回目 ${Math.round(rate * 100)}%` : ""}</div></div></div>
          <div class="marbles" aria-label="${b.filled}/${s.gauge}マス">${Array.from({ length: s.gauge }, (_, j) => `<span class="marble ${j < b.filled ? "on" : j < after ? "ghost" : ""}"></span>`).join("")}</div>
          <div class="left-n">${after >= s.gauge ? "このターンで出荷" : `あと${s.gauge - after}マス`}</div>
          <div class="tray">${tray || `<span class="empty">${S.selected ? "ここに置く" : "駒を置く場所"}</span>`}</div>
        </div></div>`;
    }).join("");
    document.getElementById("center").innerHTML = `
      <div class="zone-label">酒の場<small>光っている札は今の手札で仕込める ・ タップで仕込む</small></div>
      <div class="market">${market}</div>
      <div class="zone-label">自分の蔵<small>仕込み中 ${S.brew.length}/${BREW_MAX}</small></div>
      <div class="brewery">${slots}</div>`;

    // 右: 求人と取引先
    const recruits = S.field.map(c => { const r = ROLES[c.role];
      return `<button class="card rcard" data-act="hire" data-cid="${c.id}" ${S.money < r.fee ? "disabled" : ""} title="${esc(c.name)}">
        <span class="koma sm ${r.kind === "ability" ? "ability" : ""}">${r.k}</span>
        <span class="who"><span class="role">${esc(c.role)}</span><br><span class="eff">${esc(r.eff)}</span></span>${koban(r.fee, true)}</button>`; }).join("");
    const shop = [...RICES, "麹", "酵母"].map(m => { const p = S.freeBuy ? 0 : priceOf(m);
      return `<button class="buy" data-act="buy" data-m="${m}" ${S.buysLeft <= 0 || S.money < p ? "disabled" : ""}><span>${m}</span><span class="p ${S.riceUp && isRice(m) ? "up" : ""}">${p}両</span></button>`; }).join("");
    document.getElementById("right").innerHTML = `
      <div class="zone-label">求人の場<small>タップで雇う ・ 給料は毎ターン1両</small></div>
      <div class="recruit-row"><div class="stack r-pool" aria-hidden="true"><div class="back"></div><div class="back"></div><div class="back"></div><span class="count">${S.rdeck.length}</span></div>
        <div class="r-cards">${recruits}</div></div>
      <button class="refresh" data-act="refresh" ${S.refreshed || S.money < 1 ? "disabled" : ""}>1両で3枚を入れ替える</button>
      <div class="board"><h3>取引先<small>あと${S.buysLeft}枚${S.freeBuy ? "・次の1枚無料" : ""}</small></h3><div class="rows">${shop}</div></div>`;

    // 下: 山札・手札・詰所・進める
    const handHtml = S.hand.map((c, i, a) => { const mid = (a.length - 1) / 2; const rot = (i - mid) * 5; const lift = Math.abs(i - mid) * 3;
      return `<div style="transform: rotate(${rot}deg) translateY(${lift}px)">${matCard(c, i >= HAND_MAX ? "over" : "")}</div>`; }).join("");
    const crew = [...S.hired, ...(S.temp ? [S.temp] : [])];
    const idle = crew.filter(p => !S.assign[p.id]).map(p => komaHtml(p, { label: ROLES[p.role].kind === "ability" ? "効く" : p.role })).join("");
    const shipN = S.brew.filter(b => b.filled + planned(b.id) >= SAKE[b.id].gauge).length;
    const top = S.discard[S.discard.length - 1];
    document.getElementById("bottom").innerHTML = `
      <div class="decks">
        <div><div class="stack deck"><div class="back"></div><div class="back"></div><div class="back"></div><span class="count">${S.deck.length}</span></div><div class="deck-label">山札</div></div>
        <div><div class="stack deck">${top ? `<div class="card" style="position:absolute;inset:0"><span class="discard-top">${top}</span></div>` : `<div class="slot" style="height:100%"></div>`}<span class="count">${S.discard.length}</span></div><div class="deck-label">捨て札</div></div>
      </div>
      <div class="hand-zone"><div class="zone-label">手札<small>${S.hand.length}/${HAND_MAX}枚</small></div><div class="hand">${handHtml || '<span class="phase">手札はありません</span>'}</div></div>
      <div class="crew"><div class="zone-label">詰所<small>置いた ${assignedCount()}/${placeLimit()} ・ 駒をタップ</small></div><div class="crew-row">${idle || '<span class="phase">全員を置きました</span>'}</div></div>
      <div class="go"><button class="go-btn" data-act="advance" ${S.over ? "disabled" : ""}><span><b>仕込む</b><small>${shipN ? `${shipN}本出荷` : "ターンを進める"}</small></span></button>
        <div class="phase">${S.pending ? "イベント札で選ぶ" : "雇う・買う・仕込む・置く"}</div></div>`;

    renderLayer();
  }

  function renderLayer() {
    const el = document.getElementById("layer"); const L = S.layer;
    if (!L) { el.innerHTML = ""; return; }
    let body = "";
    if (L === "ship") {
      const items = S.lastShip.length ? `<div class="ship-row">${S.lastShip.map(r => `<div class="ship"><span class="nm">${esc(r.s.name)}</span><span class="v">+${r.v}両</span><span class="calc">${esc(r.calc)}</span><span class="say">${esc(r.s.say)}</span></div>`).join("")}</div>` : `<div class="note">このターンに出荷できた酒はありません。</div>`;
      const gain = S.lastShip.reduce((a, r) => a + r.v, 0);
      body = `<h2>${S.turn}ターン目の出荷</h2>${items}<div class="ledger"><span>売上 +${gain}両 ／ 給料 −${salaryTotal()}両（${S.hired.length}人）</span><b>${S.money - salaryTotal()}両になる</b></div><button class="cta" data-act="aftership">給料を払って次のターンへ</button>`;
    }
    if (L === "discard") {
      const need = S.hand.length - HAND_MAX;
      body = `<h2>手札を減らす</h2><div class="note">手札は5枚までです。捨てる札を${need}枚選んでください。</div>
        <div class="pick-hand">${S.hand.map(c => `<button data-act="dsel" data-id="${c.id}" style="background:none;border:0;padding:0">${matCard(c, S.discardSel.includes(c.id) ? "picked" : "")}</button>`).join("")}</div>
        <button class="cta" data-act="discard" ${S.discardSel.length !== need ? "disabled" : ""}>捨てて給料を払う</button>`;
    }
    if (L === "end") {
      const o = S.over, counts = {}; S.log.forEach(x => counts[x.id] = (counts[x.id] || 0) + 1);
      const rank = RANKS.find(([min]) => S.money >= min)[1];
      const names = Object.keys(counts).map(id => SAKE[id].name).join("、") || "なし";
      const share = o.kind === "finish" ? `岩瀬酒造 蔵元カードゲーム（試作）で20ターン。所持金${S.money}両、ランク${rank}。造った酒: ${names}` : `岩瀬酒造 蔵元カードゲーム（試作）で${o.turn}ターン目に廃業。造った酒: ${names}`;
      body = `<h2>${o.kind === "finish" ? "二十ターン、お疲れさまでした" : `${o.turn}ターン目で廃業`}</h2>
        ${o.kind === "finish" ? `<div class="end-head"><span class="end-money">${S.money}両</span><span class="rank">ランク ${rank}</span><span class="note">ランクの基準は仮です</span></div>` : `<div class="note">給料を払えませんでした。</div>`}
        <div class="zukan">${Object.keys(counts).map(id => `<div><b>${esc(SAKE[id].name)}</b>${counts[id]}回出荷 ・ ${esc(SAKE[id].say)}</div>`).join("") || `<div>出荷した酒はありません。</div>`}</div>
        <div class="note">ここで造った酒は <a class="shop-link" href="${SHOP_URL}" target="_blank" rel="noopener">岩の井 蔵元直送ショップ</a> で買えます。ゲームの中では購入を扱いません。20歳未満の者の飲酒は法律で禁止されています。</div>
        <textarea id="share-text" class="share" readonly aria-label="結果を共有する文章">${esc(share)}</textarea>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="cta" data-act="copy">文章ごとコピー</button><button class="cta light" data-act="restart">もう一度遊ぶ</button></div>`;
    }
    if (L === "help") {
      body = `<h2>遊び方</h2><div class="note">20ターン後の所持金が点数です。給料を払えなくなったら廃業です。</div>
        <ol class="rules"><li>イベント札が1枚めくれ、すぐ効く</li><li>山札から2枚引く</li><li>求人の場の札をタップして雇う</li><li>取引先で素材を2枚まで買う</li><li>光っている酒の場の札をタップして仕込む（3枚まで）</li><li>詰所の駒をタップし、酒の札をタップして置く</li><li>「仕込む」でマスが埋まり、埋まりきった酒が出荷される</li><li>給料を1人1両払う</li></ol>
        <div class="note">蔵人はどの酒でも1マス。酛屋・船頭・蔵守は得意な酒で2マス、ほかでは0。金色の駒は置かなくても効く。同じ酒の2回目は80%、3回目から60%。置いた駒は次のターンもそのまま残る。</div>
        <div class="disclaimer">ハッカソンの試作です。岩瀬酒造の公式のものではありません。数字はすべて仮です。</div>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="cta" data-act="close">盤面に戻る</button><button class="cta light" data-act="restart">1ターン目から始める</button><button class="cta light" data-act="sample">7ターン目の見本に戻す</button></div>`;
    }
    el.innerHTML = `<div class="layer" ${L === "help" ? 'data-act="close"' : ""}><div class="panel" role="dialog" aria-modal="true">${body}</div></div>`;
  }

  // ---------- 入力 ----------
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]"); if (!el) return; const a = el.dataset.act;
    if (a === "close" && el.classList.contains("layer") && e.target !== el) return;
    switch (a) {
      case "layer": S.layer = el.dataset.l; render(); break;
      case "close": S.layer = null; render(); break;
      case "advance": advance(); break;
      case "aftership": afterShip(); break;
      case "koma": e.stopPropagation(); selectKoma(el.dataset.pid); break;
      case "place": placeOn(el.dataset.sake); break;
      case "quit": e.stopPropagation(); quitSake(el.dataset.sake); break;
      case "hire": hire(Number(el.dataset.cid)); break;
      case "refresh": refreshField(); break;
      case "buy": buy(el.dataset.m); break;
      case "start": startSake(el.dataset.sake); break;
      case "resolve": resolve(el.dataset.k, el.dataset.a); break;
      case "dsel": { const id = Number(el.dataset.id), i = S.discardSel.indexOf(id); if (i >= 0) S.discardSel.splice(i, 1); else if (S.discardSel.length < S.hand.length - HAND_MAX) S.discardSel.push(id); render(); break; }
      case "discard": doDiscard(); break;
      case "restart": newGame(Math.floor(Math.random() * 1e9)); render(); toast("1ターン目から始めました。"); break;
      case "sample": sampleGame(); render(); break;
      case "copy": { const ta = document.getElementById("share-text"); const sel = () => { ta.select(); toast("文章を選びました。コピーしてください。"); };
        try { navigator.clipboard.writeText(ta.value).then(() => toast("コピーしました。"), sel); } catch { sel(); } break; }
    }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && S.layer === "help") { S.layer = null; render(); }
    if ((e.key === "Enter" || e.key === " ") && e.target.matches('[data-act="place"]')) { e.preventDefault(); placeOn(e.target.dataset.sake); }
  });

  // ---------- 盤面を画面に合わせる ----------
  function fit() {
    const vp = document.getElementById("viewport"); const cs = getComputedStyle(vp);
    const w = vp.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const h = vp.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const s = Math.max(.2, Math.min(w / 960, h / 540, 1.6));
    document.documentElement.style.setProperty("--s", s.toFixed(4));
  }
  window.addEventListener("resize", fit);
  sampleGame(); render(); fit();
})();
</script>
